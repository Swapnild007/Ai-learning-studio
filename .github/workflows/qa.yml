name: AI Learning Studio QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run static QA
        run: python3 qa_test.py

      - name: Check Python syntax
        run: python3 -m py_compile server.py qa_test.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check curriculum.js
          node --check learning-engine.js
          node --check learning-engine.test.js

      - name: Run learning engine tests
        run: node learning-engine.test.js

      - name: Run curriculum runtime QA
        run: node curriculum_runtime_qa.js
